name: Supabase keep-alive

# Free-tier Supabase pauses a project after ~7 days without API activity.
# Sibling coffee-brew-log once had a weekly ping sit exactly on that
# boundary (2026-06 pause warning), so this runs twice a week. Cloud cron
# fires even when the laptop is asleep.
#
# The publishable key is the same public key the client bundle ships (safe
# to embed); RLS hides all rows from anon, so the response is always [] —
# the query itself is the activity that resets the pause timer.
#
# NOTE: GitHub disables cron workflows after ~60 days without repo activity
# (it emails first). The push trigger below also makes edits to this file
# run it once immediately — a built-in smoke test.

on:
  schedule:
    - cron: '30 1 * * 1,4' # Mon + Thu 01:30 UTC = 08:30 ICT
  workflow_dispatch:
  push:
    paths: ['.github/workflows/supabase-keepalive.yml']

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://jjpmhhxveqmwsqbdomwe.supabase.co
      SUPABASE_KEY: sb_publishable_wwak_etpvlLHwe6wsGMffA_OC7kr-zI
    steps:
      # Retries absorb transient runner/DNS blips. A PAUSED project still
      # fails every retry (its subdomain leaves DNS entirely) and the run
      # goes red — that failure email means: dashboard → Resume project.
      # 2026-07-16 lesson: pings sent AFTER the pause-warning email do NOT
      # cancel an already-scheduled pause; only the dashboard does.
      - name: Query REST endpoint (real DB read = project activity)
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' \
            --retry 5 --retry-all-errors --retry-delay 20 --max-time 30 \
            "$SUPABASE_URL/rest/v1/matcha_tins?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY") || true
          echo "HTTP $code — body: $(cat body.json 2>/dev/null)"
          test "$code" = "200"
